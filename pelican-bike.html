<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>加州褐鹈鹕高速骑行 · 晴天巡航版</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 0%,#1d2733 0%,#0b0f14 70%);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage{position:relative;width:min(92vw,920px)}
  svg#scene{display:block;width:100%;height:auto;border-radius:16px;
    box-shadow:0 22px 60px rgba(0,0,0,.6);background:#0b0f14}
  .hud{position:absolute;left:14px;top:12px;display:flex;gap:8px;z-index:5}
  .wbtn{
    font:600 14px/1 inherit;letter-spacing:.06em;padding:8px 15px;border-radius:999px;
    border:1px solid rgba(255,255,255,.42);background:rgba(12,22,32,.42);color:#eaf4fb;
    cursor:pointer;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    transition:background .28s ease,color .28s ease,box-shadow .28s ease,transform .12s ease;
  }
  .wbtn:hover{background:rgba(255,255,255,.2)}
  .wbtn:active{transform:translateY(1px)}
  .wbtn.on{background:#f2f8fc;color:#122530;border-color:#ffffff;box-shadow:0 4px 16px rgba(255,255,255,.28)}
  .wx{opacity:0;transition:opacity .62s ease}
  svg#scene.w-sunny  .wx-sunny {opacity:1}
  svg#scene.w-cloudy .wx-cloudy{opacity:1}
  svg#scene.w-rainy  .wx-rainy {opacity:1}
</style>
</head>

    <linearGradient id="wetGrad" x1="0" y1="0" x2="0" y2="1">

      <stop offset="0.45" stop-color="#9fc0d6" stop-opacity="0.22"/>
      <stop offset="1"   stop-color="#7fa2ba" stop-opacity="0.04"/>

    <linearGradient id="roadSunny" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9997c"/><stop offset="0.35" stop-color="#93856c"/><stop offset="1" stop-color="#6f6555"/>
    </linearGradient>
    <linearGradient id="roadCloudy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b9299"/><stop offset="0.35" stop-color="#767d85"/><stop offset="1" stop-color="#585f66"/>
    </linearGradient>
    <linearGradient id="roadRainy" x1="0" y1="0" x2="0" y2="1">

  <!-- ============================================================
       5. 近景地面细节  417 px/s

<script>
(function () {
  var scene = document.getElementById('scene');
  var btns = document.querySelectorAll('.wbtn');
  var kinds = ['sunny', 'cloudy', 'rainy'];

  function applyWeather(w) {
    for (var i = 0; i < kinds.length; i++) {
      scene.classList.remove('w-' + kinds[i]);
    }
    scene.classList.add('w-' + w);
    scene.setAttribute('aria-label', '加州褐鹈鹕高速骑行 - ' + w);
    for (var j = 0; j < btns.length; j++) {
      var on = btns[j].getAttribute('data-w') === w;
      btns[j].classList.toggle('on', on);
      btns[j].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }

  function handler() {
    applyWeather(this.getAttribute('data-w'));
  }

  for (var k = 0; k < btns.length; k++) {
    btns[k].addEventListener('click', handler, false);
  }
})();
</script>
